name: app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_analytics: ^11.6.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^17.0.0

  # UI
  cupertino_icons: ^1.0.8

  # Utilities
  image_picker: ^1.2.0
  url_launcher: ^6.3.0
  file_picker: ^6.1.1
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^1.2.1
  flutter_admin_scaffold: ^1.4.0
  cached_network_image: ^3.4.1
  
  # Maps
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  
  # OpenStreetMap
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_map_marker_popup: ^5.0.0

  # UI Dependencies
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^2.7.0
  
  # Logging
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # ✅ Images
    - assets/images/
    - assets/images/google.jfif
    - assets/images/logo.jpg
    - assets/images/splash.jpg
    - assets/images/onboarding1.jpg
    - assets/images/onboarding2.jpg
    - assets/images/onboarding3.jpg
    - assets/images/register.jpg
    - assets/images/login.jpg
    - assets/images/profile.jpg
    - assets/images/karachi.jpg
    - assets/images/lahore.jpg
    - assets/images/islamabad.jpg
    - assets/images/hunza.jpg
    # - assets/images/attraction.jpg
    
    # ✅ Icons & Lottie
